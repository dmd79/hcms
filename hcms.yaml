  - platform: template
    name: "open"
    id: btn_par_open
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);

          // Carattere PRIMA del cursore
          char prev = (pos > 0) ? s[pos - 1] : '\0';

          // Moltiplicazione implicita SOLO se non siamo all'inizio
          if(pos > 0 && (isdigit(prev) || prev == ')')) {
              s.insert(pos, "*");
              pos++;
              id(cursor_pos) = pos;
          }

          // Inserisci parentesi aperta
          s.insert(pos, "(");
          id(cursor_pos) = pos + 1;

          id(update_input_display)->execute();

  - platform: template
    name: "close"
    id: btn_par_close
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);

          // Non inserire se buffer vuoto
          if(s.empty()) return;

          // Controlla carattere precedente
          if(pos == 0) return; // niente prima del cursore
          char last = s[pos-1];
          if(last=='+' || last=='-' || last=='*' || last=='/' || last=='^' || last=='.' || last=='(') return;

          // Conta parentesi aperte fino al cursore
          int open_count = 0;
          for(int i=0; i<pos; i++) {
              if(s[i]=='(') open_count++;
              else if(s[i]==')') open_count--;
          }
          if(open_count <= 0) return;  // Nessuna parentesi aperta da chiudere

          // 🔹 Controlla se si è in mezzo a un numero → non inserire
          if(pos < s.size() && isdigit(s[pos])) return;

          // 🔹 Controlla se dentro la parentesi c'è qualcosa
          int last_open = -1;
          for(int i=pos-1; i>=0; i--) {
              if(s[i]=='(') { last_open = i; break; }
          }
          if(last_open >= 0) {
              bool has_content = false;
              for(int i=last_open+1; i<pos; i++) {
                  if(isdigit(s[i]) || isalpha(s[i]) || s[i]==')') {
                      has_content = true;
                      break;
                  }
              }
              if(!has_content) return; // niente dentro la parentesi → non inserire
          }

          // Inserisci parentesi chiusa
          s.insert(pos, ")");
          id(cursor_pos)++;
          id(update_input_display)->execute();

  - platform: template
    name: "equal"
    id: btn_equal
    on_press:
      - lambda: |-
          std::string expr = id(buffer);

          // Controlla parentesi aperte/chiuse
          int open_par = 0, close_par = 0;
          for(char c : expr) {
              if(c=='(') open_par++;
              else if(c==')') close_par++;
          }

          if(open_par > close_par) {
              id(paren_alert) = true;
              id(paren_alert_count) = open_par - close_par;
              return;
          }

          // Calcola risultato
          double res = evalExpression(expr);
          id(result) = res;
          id(last_was_result) = true;

          char buf[32];
          if(std::isnan(res) || std::isinf(res)) {
              snprintf(buf, sizeof(buf), "ERROR");
          } else {
              double abs_res = std::fabs(res);

              // 🔹 Se troppo grande o troppo piccolo → scientifica
              if(abs_res >= 1e15 || (abs_res > 0 && abs_res < 1e-7)) {
                  snprintf(buf, sizeof(buf), "%.7e", res);
              } else {
                  // 🔹 Numero normale → massimo 15 cifre totali
                  char temp[64];
                  snprintf(temp, sizeof(temp), "%.15f", res);

                  std::string s(temp);
                  // Rimuove gli zeri finali
                  while(s.back()=='0') s.pop_back();
                  if(s.back()=='.') s.pop_back();

                  // Limita a 15 caratteri totali
                  if(s.length() > 15) s = s.substr(0, 15);
                  snprintf(buf, sizeof(buf), "%s", s.c_str());
              }
          }

          id(buffer) = std::string(buf);
          id(cursor_pos) = id(buffer).length();
          id(paren_alert) = false;
          id(update_input_display)->execute();

  - platform: template
    name: "C"
    id: btn_clear
    on_press:
      - lambda: |-
          id(buffer).clear();
          id(result)=0; 
          id(a)=0; 
          id(b)=0; 
          id(op)=' '; 
          id(last_was_result)=false;

          // CURSORE ALLA FINE (inizio buffer vuoto)
          id(cursor_pos) = id(buffer).length();

          id(update_input_display)->execute();

  - platform: template
    name: "backspace"
    id: btn_backspace
    on_press:
      - lambda: |-
          std::string& s = id(buffer);
          if(s.empty() || id(cursor_pos)==0) return;

          int pos = id(cursor_pos) - 1;

          // Lista delle funzioni da trattare come un unico "carattere"
          const std::vector<std::string> funcs = {
              "sin(", "cos(", "tan(", "asin(", "acos(", "atan(", "sqrt(", "ln(", "log(", "exp("
          };

          // Controlla se prima del cursore c'è una funzione
          for(auto &f : funcs) {
              int len = f.length();
              if(pos - len + 1 >= 0 && s.substr(pos - len + 1, len) == f) {
                  s.erase(pos - len + 1, len);
                  id(cursor_pos) -= len;
                  id(update_input_display)->execute();
                  return;
              }
          }

          // Controlla se siamo subito dopo una potenza ^(...)
          if(s[pos] == ')' && pos > 0) {
              int depth = 1;
              int i = pos - 1;
              while(i >= 0 && depth > 0) {
                  if(s[i] == ')') depth++;
                  else if(s[i] == '(') depth--;
                  i--;
              }
              // Controlla se prima della parentesi c'è ^
              if(i >= 0 && s[i] == '^') {
                  s.erase(i, pos - i + 1); // cancella ^(...) tutto insieme
                  id(cursor_pos) = i;
                  id(update_input_display)->execute();
                  return;
              }
          }

          // Altrimenti cancella un solo carattere
          s.erase(pos, 1);
          id(cursor_pos)--;
          id(update_input_display)->execute();

  - platform: template
    name: "cursor_left"
    id: btn_cursor_left
    on_press:
      - lambda: |-
          if(id(cursor_pos) == 0) return;

          std::string &s = id(buffer);
          int pos = id(cursor_pos) - 1;

          // 🔹 CASO 1: se siamo subito dopo ')'
          if(s[pos] == ')') {
              // entra DENTRO la parentesi
              id(cursor_pos) = pos;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 2: se siamo su '('
          if(s[pos] == '(') {
              pos--;

              // se c'è un '^' prima → salta
              if(pos >= 0 && s[pos] == '^') pos--;

              // se ci sono lettere → salta nome funzione
              while(pos >= 0 && isalpha(s[pos])) pos--;

              id(cursor_pos) = pos + 1;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 3: movimento normale
          id(cursor_pos)--;
          id(update_input_display)->execute();

  - platform: template
    name: "cursor_right"
    id: btn_cursor_right
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int len = s.length();
          int pos = id(cursor_pos);

          if(pos >= len) return;

          // 🔹 CASO 1: funzione (lettere seguite da '(')
          if(isalpha(s[pos])) {
              int i = pos;
              while(i < len && isalpha(s[i])) i++;

              if(i < len && s[i] == '(') {
                  // entra dentro la funzione
                  id(cursor_pos) = i + 1;
                  id(update_input_display)->execute();
                  return;
              }
          }

          // 🔹 CASO 2: '(' normale → entra
          if(s[pos] == '(') {
              id(cursor_pos) = pos + 1;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 3: ')'
          if(s[pos] == ')') {
              id(cursor_pos) = pos + 1;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 4: default
          id(cursor_pos)++;
          id(update_input_display)->execute();

