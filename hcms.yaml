# =====================
# FUNZIONI ESISTENTI - NEG e Potenze
# =====================
  - platform: template
    name: "NEG"
    id: btn_neg_all
    on_press:
      - lambda: |-
          std::string& s = id(buffer);
          int pos = id(cursor_pos);

          // CASO 0: risultato già calcolato
          if (id(last_was_result)) {
              id(result) = -id(result);
              char buf[32];
              snprintf(buf, sizeof(buf), "%.15g", id(result));
              s = buf;
              id(last_was_result) = true;
              id(cursor_pos) = s.length();
              id(update_result_display)->execute();
              return;
          }

          // Buffer vuoto → aggiungi -
          if(s.empty()) {
              s += "-";
              id(cursor_pos)++;
              id(update_input_display)->execute();
              return;
          }

          // Buffer contiene solo "-" → rimuovi
          if(s == "-") {
              s.clear();
              id(cursor_pos) = 0;
              id(update_input_display)->execute();
              return;
          }

          // ===== LOGICA BASATA SUL CURSORE =====

          // Se cursore a inizio buffer → aggiungi/rimuovi - all'inizio
          if(pos == 0) {
              if(s[0] == '-') {
                  s.erase(0, 1);
              } else {
                  s.insert(0, "-");
                  id(cursor_pos) = 1;
              }
              id(update_input_display)->execute();
              return;
          }

          // Se cursore è subito dopo un - iniziale, rimuovilo
          if(pos == 1 && s[0] == '-') {
              s.erase(0, 1);
              id(cursor_pos) = 0;
              id(update_input_display)->execute();
              return;
          }

          // Carattere PRIMA e DOPO il cursore
          char prev = s[pos - 1];
          char curr = (pos < s.length()) ? s[pos] : '\0';

          // PRIORITÀ 1: Se il cursore è DOPO un numero, agisci sul numero
          if(isdigit(prev) || prev == '.') {
              // Trova INIZIO del numero
              int i = pos - 1;
              while(i >= 0 && (isdigit(s[i]) || s[i]=='.')) i--;
              int num_start = i + 1;

              // Toggle - all'INIZIO del numero
              if(i >= 0 && s[i] == '-' &&
                 (i == 0 || strchr("+-*/^%(", s[i - 1]))) {
                  s.erase(i, 1);
                  id(cursor_pos)--;
              } else {
                  s.insert(num_start, "-");
                  id(cursor_pos)++;
              }

              id(update_input_display)->execute();
              return;
          }

          // PRIORITÀ 2: Se il cursore è SU un numero (carattere dopo), agisci sul numero
          if(isdigit(curr) || curr == '.') {
              // Trova INIZIO del numero
              int i = pos;
              while(i >= 0 && (isdigit(s[i]) || s[i]=='.')) i--;
              int num_start = i + 1;

              // Toggle - all'INIZIO del numero
              if(i >= 0 && s[i] == '-' &&
                 (i == 0 || strchr("+-*/^%(", s[i - 1]))) {
                  s.erase(i, 1);
                  id(cursor_pos)--;
              } else {
                  s.insert(num_start, "-");
                  id(cursor_pos)++;
              }

              id(update_input_display)->execute();
              return;
          }

          // PRIORITÀ 3: Se il cursore è SU una lettera (funzione), agisci sulla funzione
          if(isalpha(curr)) {
              // Trova INIZIO del nome della funzione
              int i = pos;
              while(i >= 0 && isalpha(s[i])) i--;
              int func_start = i + 1;

              // Toggle - all'INIZIO della funzione
              if(i >= 0 && s[i] == '-' &&
                 (i == 0 || strchr("+-*/^%(", s[i - 1]))) {
                  s.erase(i, 1);
                  id(cursor_pos)--;
              } else {
                  s.insert(func_start, "-");
                  id(cursor_pos)++;
              }

              id(update_input_display)->execute();
              return;
          }

          // PRIORITÀ 4: Se il cursore è SU '(', agisci PRIMA della '('
          if(curr == '(') {
              // Controlla se è una funzione
              int i = pos - 1;
              while(i >= 0 && isalpha(s[i])) i--;
              int func_start = i + 1;

              if(func_start < pos) {
                  // È una funzione: toggle - prima del nome della funzione
                  if(i >= 0 && s[i] == '-' &&
                     (i == 0 || strchr("+-*/^%(", s[i - 1]))) {
                      s.erase(i, 1);
                      id(cursor_pos)--;
                  } else {
                      s.insert(func_start, "-");
                      id(cursor_pos)++;
                  }
              } else {
                  // Parentesi normale: toggle - prima della '('
                  if(pos > 0 && s[pos - 1] == '-' &&
                     (pos - 1 == 0 || strchr("+-*/^%(", s[pos - 2]))) {
                      s.erase(pos - 1, 1);
                      id(cursor_pos)--;
                  } else {
                      s.insert(pos, "-");
                      id(cursor_pos)++;
                  }
              }

              id(update_input_display)->execute();
              return;
          }

          // CASO 1: Cursore su un operatore → toggle - prima dell'operatore
          if(strchr("+-*/^%", prev)) {
              int op_pos = pos - 1;
              // Controlla se c'è già un - prima dell'operatore
              if(op_pos > 0 && s[op_pos - 1] == '-') {
                  // Controlla che il - sia un meno unario, non un operatore
                  if(op_pos - 1 == 0 || strchr("+-*/^%(", s[op_pos - 2])) {
                      s.erase(op_pos - 1, 1);
                      id(cursor_pos)--;
                      id(update_input_display)->execute();
                      return;
                  }
              }
              // Altrimenti aggiungi -
              s.insert(op_pos, "-");
              id(cursor_pos)++;
              id(update_input_display)->execute();
              return;
          }

          // CASO 2: Cursore dopo ')'
          if(prev == ')') {
              // Trova la '(' corrispondente
              int depth = 1;
              int i = pos - 2;
              while(i >= 0 && depth > 0) {
                  if(s[i] == ')') depth++;
                  else if(s[i] == '(') depth--;
                  i--;
              }
              int open_pos = i + 1;

              // Controlla se è una funzione (lettere prima della '(')
              int func_start = open_pos - 1;
              while(func_start >= 0 && isalpha(s[func_start])) func_start--;
              func_start++;

              bool is_function = (func_start < open_pos);

              if(is_function) {
                  // È una funzione: toggle del - PRIMA del nome della funzione
                  if(func_start > 0 && s[func_start - 1] == '-' &&
                     (func_start - 1 == 0 || strchr("+-*/^%(", s[func_start - 2]))) {
                      s.erase(func_start - 1, 1);
                      id(cursor_pos)--;
                  } else {
                      s.insert(func_start, "-");
                      id(cursor_pos)++;
                  }
              } else {
                  // Parentesi normale: toggle del - PRIMA della '('
                  if(open_pos > 0 && s[open_pos - 1] == '-' &&
                     (open_pos - 1 == 0 || strchr("+-*/^%(", s[open_pos - 2]))) {
                      s.erase(open_pos - 1, 1);
                      id(cursor_pos)--;
                  } else {
                      s.insert(open_pos, "-");
                      id(cursor_pos)++;
                  }
              }

              id(update_input_display)->execute();
              return;
          }

          // CASO 3: Cursore dopo '(' → non fare nulla
          if(prev == '(') {
              return;
          }

  - platform: template
    name: "+/- exp"
    id: btn_neg_exp
    on_press:
      - lambda: |-
          std::string& s = id(buffer);

          // CASO 0: risultato già calcolato
          if(id(last_was_result)) {
              id(result) = -id(result);
              char buf[32];
              snprintf(buf, sizeof(buf), "%.15g", id(result));
              s = buf;
              id(cursor_pos) = s.length();
              id(update_result_display)->execute();
              return;
          }

          // Trova l'ultimo ^
          int p = s.find_last_of('^');
          if(p == std::string::npos) return;

          // =========================
          // CASO ^(...)
          // =========================
          if(p + 1 < s.size() && s[p + 1] == '(') {

              // toggle del -
              if(p + 2 < s.size() && s[p + 2] == '-') {
                  s.erase(p + 2, 1);
              } else {
                  s.insert(p + 2, "-");
              }

              // trova fine parentesi
              int depth = 1;
              int i = p + 2;
              while(++i < s.size() && depth > 0) {
                  if(s[i] == '(') depth++;
                  else if(s[i] == ')') depth--;
              }

              id(cursor_pos) = i;   // ← DOPO l'esponente
              id(update_input_display)->execute();
              return;
          }

          // =========================
          // CASO ^numero
          // =========================
          int i = p + 1;

          // toggle -
          if(i < s.size() && s[i] == '-') {
              s.erase(i, 1);
          } else if(i < s.size() && (isdigit(s[i]) || s[i] == '.')) {
              s.insert(i, "-");
          } else {
              return;
          }

          // scorri fino a fine numero
          int end = p + 1;
          if(s[end] == '-') end++;
          while(end < s.size() && (isdigit(s[end]) || s[end] == '.')) end++;

          id(cursor_pos) = end;   // ← cursore DOPO l'esponente
          id(update_input_display)->execute();

  - platform: template
    name: "x2"
    id: btn_pow2
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);
          if(pos == 0) return;
          char last = s[pos-1];
          if(!isdigit(last) && last != ')') return;
          s.insert(pos, "^2");
          id(cursor_pos) = pos + 2;
          id(update_input_display)->execute();

  - platform: template
    name: "x3"
    id: btn_pow3
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);
          if(pos == 0) return;
          char last = s[pos-1];
          if(!isdigit(last) && last != ')') return;
          s.insert(pos, "^3");
          id(cursor_pos) = pos + 2;
          id(update_input_display)->execute();

  - platform: template
    name: "x^y"
    id: btn_pow
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);
          if(pos == 0) return;
          char last = s[pos-1];
          if(!isdigit(last) && last != ')') return;
          s.insert(pos, "^");
          id(cursor_pos) = pos + 1;
          id(update_input_display)->execute();

  - platform: template
    name: "pi"
    id: btn_pi
    on_press:
      - lambda: |-
          // Non inserire dopo risultato, ')' o numero
          if(id(last_was_result)) return;
          if(!id(buffer).empty() && (id(buffer).back() == ')' || isdigit(id(buffer).back()))) return;

          id(buffer).insert(id(cursor_pos), "3.1415926535");
          id(cursor_pos) += 12;
          id(update_input_display)->execute();

  - platform: template
    name: "e"
    id: btn_e
    on_press:
      - lambda: |-
          // Non inserire dopo risultato, ')' o numero
          if(id(last_was_result)) return;
          if(!id(buffer).empty() && (id(buffer).back() == ')' || isdigit(id(buffer).back()))) return;

          id(buffer).insert(id(cursor_pos), "2.7182818284");
          id(cursor_pos) += 12;
          id(update_input_display)->execute();

# =====================
# INTERVALLO PER LAMPEGGIO CURSORE
# =====================
interval:
  - interval: 500ms
    then:
      - script.execute: update_input_display