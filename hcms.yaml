# =====================
# FUNZIONI ESISTENTI - NEG e Potenze
# =====================
  - platform: template
    name: "NEG"
    id: btn_neg_all
    on_press:
      - lambda: |-
          std::string& s = id(buffer);
          int pos = id(cursor_pos);

          // CASO 0: risultato già calcolato → nega il risultato
          if (id(last_was_result)) {
              id(result) = -id(result);
              char buf[32];
              snprintf(buf, sizeof(buf), "%.23g", id(result));
              s = buf;
              id(last_was_result) = true;
              id(cursor_pos) = s.length();
              id(update_result_display)->execute();
              return;
          }

          auto is_op = [](char c) -> bool {
              return c=='+' || c=='-' || c=='*' || c=='/' || c=='^' || c=='%' || c=='(';
          };

          // toggle_num: nega il numero che inizia a num_start; s[i] = char a sinistra
          //   '-' unario  (i==0 o preceduto da operatore) → rimuovi
          //   '-' binario (preceduto da cifra/')'))        → sostituisci con '+'
          //   '+' binario (preceduto da cifra/')'))        → sostituisci con '-'
          //   altro                                        → inserisci '-' unario
          auto toggle_num = [&](int i, int num_start) {
              if (i >= 0 && s[i] == '-') {
                  bool unary = (i == 0 || is_op(s[i-1]));
                  if (unary) { s.erase(i, 1); id(cursor_pos)--; }
                  else       { s[i] = '+'; }
              } else if (i >= 0 && s[i] == '+' && i > 0 && !is_op(s[i-1])) {
                  s[i] = '-';
              } else {
                  s.insert(num_start, "-");
                  id(cursor_pos)++;
              }
          };

          if (s.empty()) {
              s = "-"; id(cursor_pos) = 1;
              id(update_input_display)->execute(); return;
          }
          if (s == "-") {
              s.clear(); id(cursor_pos) = 0;
              id(update_input_display)->execute(); return;
          }

          char prev = (pos > 0) ? s[pos-1] : '\0';

          // CASO A: cursore dopo cifra o '.'
          if (isdigit(prev) || prev == '.') {
              int i = pos - 1;
              while (i >= 0 && (isdigit(s[i]) || s[i] == '.')) i--;
              toggle_num(i, i + 1);
              id(update_input_display)->execute(); return;
          }

          // CASO B: cursore dopo ')' → nega la parentesi o la funzione
          if (prev == ')') {
              int depth = 1, i = pos - 2;
              while (i >= 0 && depth > 0) {
                  if (s[i] == ')') depth++;
                  else if (s[i] == '(') depth--;
                  i--;
              }
              int open_pos = i + 1;
              int fname_start = open_pos;
              while (fname_start > 0 && isalpha(s[fname_start-1])) fname_start--;
              toggle_num(fname_start - 1, fname_start);
              id(update_input_display)->execute(); return;
          }

          // CASO C: cursore dentro parentesi → nega l'ultimo numero a sinistra
          {
              int depth = 0;
              for (int i = pos-1; i >= 0; i--) {
                  if (s[i] == ')') depth++;
                  else if (s[i] == '(') { depth--; if (depth < 0) { depth = -1; break; } }
              }
              if (depth < 0) {
                  int i = pos - 1;
                  while (i >= 0 && !isdigit(s[i]) && s[i] != '.') {
                      if (s[i] == '(' || s[i] == '+' || s[i] == '*' ||
                          s[i] == '/' || s[i] == '^' || s[i] == '%') return;
                      i--;
                  }
                  if (i < 0) return;
                  while (i >= 0 && (isdigit(s[i]) || s[i] == '.')) i--;
                  toggle_num(i, i + 1);
                  id(update_input_display)->execute(); return;
              }
          }

          // tutti gli altri casi → niente
  - platform: template
    name: "+/- exp"
    id: btn_neg_exp
    on_press:
      - lambda: |-
          std::string& s = id(buffer);

          // CASO 0: risultato già calcolato
          if(id(last_was_result)) {
              id(result) = -id(result);
              char buf[32];
              snprintf(buf, sizeof(buf), "%.23g", id(result));
              s = buf;
              id(cursor_pos) = s.length();
              id(update_result_display)->execute();
              return;
          }

          // Trova l'ultimo ^
          int p = s.find_last_of('^');
          if(p == std::string::npos) return;

          // =========================
          // CASO ^(...)
          // =========================
          if(p + 1 < s.size() && s[p + 1] == '(') {

              // toggle del -
              if(p + 2 < s.size() && s[p + 2] == '-') {
                  s.erase(p + 2, 1);
              } else {
                  s.insert(p + 2, "-");
              }

              // trova fine parentesi
              int depth = 1;
              int i = p + 2;
              while(++i < s.size() && depth > 0) {
                  if(s[i] == '(') depth++;
                  else if(s[i] == ')') depth--;
              }

              id(cursor_pos) = i;   // ← DOPO l'esponente
              id(update_input_display)->execute();
              return;
          }

          // =========================
          // CASO ^numero
          // =========================
          int i = p + 1;

          // toggle -
          if(i < s.size() && s[i] == '-') {
              s.erase(i, 1);
          } else if(i < s.size() && (isdigit(s[i]) || s[i] == '.')) {
              s.insert(i, "-");
          } else {
              return;
          }

          // scorri fino a fine numero
          int end = p + 1;
          if(s[end] == '-') end++;
          while(end < s.size() && (isdigit(s[end]) || s[end] == '.')) end++;

          id(cursor_pos) = end;   // ← cursore DOPO l'esponente
          id(update_input_display)->execute();

