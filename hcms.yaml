    restore_value: false
    initial_value: ""

  - id: settings_mode
    type: bool
    initial_value: 'false'

  - id: settings_press_count
    type: int
    initial_value: '0'

  - id: display_timeout_min
    type: int
    restore_value: true
    initial_value: '1'
  - id: mem1
    type: std::string
    restore_value: true
    initial_value: ""
  - id: mem2
    type: std::string
    restore_value: true
    initial_value: ""
  - id: mem3
    type: std::string
    restore_value: true
    initial_value: ""
  - id: last_key_time
    type: uint32_t
    initial_value: '0'

# =====================
# SCRIPT DISPLAY
# =====================
script:
  - id: refresh_display
    then:
      - lambda: |-
          static auto my_display_1 = new LedDisplay(13, 12, 9, 10, 14, 24);
          my_display_1->setCursor(0);
          my_display_1->setString(id(text_1).state.c_str());
          my_display_1->scroll(0);
          return;

  - id: show_brightness_display
    then:
      - lambda: |-
          static auto my_display_1 = new LedDisplay(13, 12, 9, 10, 14, 24);
          char buf[25];
          int cnt = id(settings_press_count);
          if (cnt == 0) {
              int bri = (int)id(display_brightness).state;
              snprintf(buf, sizeof(buf), "Brightness %d", bri);
          } else if (cnt == 1) {
              int tmo = id(display_timeout_min);
              snprintf(buf, sizeof(buf), "Timeout %dmin", tmo);
          } else if (cnt == 2) {
              snprintf(buf, sizeof(buf), "Press END to power off");
          } else {
              // Hash build: ultimi 6 char di data+ora compilazione
              {
                  // fw_version.state es: "2025.12.1 (config hash abcdef123456)"
                  std::string fw = id(fw_version).state;
                  // Trova "hash " e prendi i 6 char successivi
                  size_t h = fw.find("hash ");
                  std::string ver = fw.substr(0, fw.find(' '));  // "2025.12.1"
                  std::string hash6 = (h != std::string::npos && h+5+6 <= fw.size())
                                      ? fw.substr(h+5, 6) : "??????";
                  snprintf(buf, sizeof(buf), "v%s (%s)", ver.c_str(), hash6.c_str());
              }
          }
          my_display_1->setCursor(0);
          my_display_1->setString(buf);
          my_display_1->scroll(0);

  - id: update_input_display
    then:
      - text.set:
          id: text_1
          value: !lambda |-
            if (id(settings_mode)) {
                static char buf[25];
                int cnt = id(settings_press_count);
                if (cnt == 0) {
                    int bri = (int)id(display_brightness).state;
                    snprintf(buf, sizeof(buf), "Brightness %d", bri);
                } else if (cnt == 1) {
                    int tmo = id(display_timeout_min);
                    snprintf(buf, sizeof(buf), "Timeout %dmin", tmo);
                } else if (cnt == 2) {
                    snprintf(buf, sizeof(buf), "Press END to power off");
                } else {
                    {
                        std::string fw = id(fw_version).state;
                        size_t h = fw.find("hash ");
                        std::string ver = fw.substr(0, fw.find(' '));
                        std::string hash6 = (h != std::string::npos && h+5+6 <= fw.size())
                                            ? fw.substr(h+5, 6) : "??????";
                        snprintf(buf, sizeof(buf), "v%s (%s)", ver.c_str(), hash6.c_str());
                    }
                }
                return (const char*)buf;
            }
            static char buf[32];
            std::string s = id(buffer);

            // Lampeggio cursore / parentesi
            static bool blink = false;
            blink = !blink;

            int pos = id(cursor_pos);
            if(pos > s.length()) pos = s.length();

            const int window_size = 24;
            int window_start = 0;
            if(pos > window_size - 1) window_start = pos - (window_size - 1);

            int cursor_in_window = pos - window_start;

            // 🔹 Calcolo parentesi aperte non chiuse
            int open_par = 0, close_par = 0;
            for(char c : s) {
              if(c=='(') open_par++;
              else if(c==')') close_par++;
            }
            int missing = open_par - close_par;
            id(paren_alert_count) = missing > 0 ? missing : 0;
            id(paren_alert) = missing > 0;

            // 🔹 Trova la '(' corrispondente alla ')' che mancherebbe alla fine
            // Parti dalla fine e vai all'indietro
            int matching_open_pos = -1;
            int balance = 0;
            for(int i = s.length() - 1; i >= 0; i--) {
              if(s[i] == ')') {
                balance--;
              }
              else if(s[i] == '(') {
                balance++;
                if(balance > 0) {
                  matching_open_pos = i;  // Questa è la ( non chiusa
                  break;
                }
              }
            }

            // 🔹 Costruzione finestra (SEMPRE senza la ( non chiusa se c'è paren_alert)
            std::string display_s(window_size, ' ');
            for(int i=0; i<window_size; i++) {
              int global_pos = window_start + i;
              if(global_pos < s.length()) {
                // Salta SEMPRE la '(' non chiusa se stiamo lampeggiando
                if(id(paren_alert) && global_pos == matching_open_pos) {
                  display_s[i] = ' ';  // Non mostrare la ( (verrà aggiunta dopo solo se blink)
                } else {
                  display_s[i] = s[global_pos];
                }
              }
            }

            if(id(paren_alert)) {
              // ===== CASO CON PARENTESI APERTE =====
              if(blink) {
                // Mostra tutto: (, ), _
                
                // Mostra la '(' non chiusa
                if(matching_open_pos >= 0) {
                  int open_in_window = matching_open_pos - window_start;
                  if(open_in_window >= 0 && open_in_window < window_size) {
                    display_s[open_in_window] = '(';
                  }
                }
                
                // Mostra la ')' alla fine
                int end_pos = s.length();
                int end_in_window = end_pos - window_start;
                if(end_in_window >= 0 && end_in_window < window_size) {
                  display_s[end_in_window] = ')';
                }

                // Mostra cursore '_' (ma non se alla fine)
                if(pos != s.length() && cursor_in_window >= 0 && cursor_in_window < window_size) {
                  display_s[cursor_in_window] = '_';
                }
              }
              // else: tutto nascosto (già gestito dalla costruzione)
            } else {
              // ===== CASO SENZA PARENTESI APERTE =====
              if(blink && cursor_in_window >= 0 && cursor_in_window < window_size) {
                display_s[cursor_in_window] = '_';
              }
            }

            snprintf(buf, sizeof(buf), "%s", display_s.c_str());
            return buf;
      - script.execute: refresh_display

  - id: update_result_display
    then:
      - text.set:
          id: text_1
          value: !lambda |-
              static char buf[25]; // 24 char + terminatore
              double v = id(result);

              if (std::isnan(v) || std::isinf(v)) {
                  snprintf(buf, sizeof(buf), "ERROR");
              } else if (std::fabs(v) >= 1e15 || (std::fabs(v) > 0 && std::fabs(v) < 1e-7)) {
                  snprintf(buf, sizeof(buf), "%.15e", v);
              } else {
                  double v_abs = std::fabs(v);
                  int int_digits = (v < 0) ? 1 : 0;
                  long long int_part = (long long)v_abs;
                  if (int_part == 0) int_digits += 1;
                  else { long long t = int_part; while (t > 0) { int_digits++; t /= 10; } }
                  int decimals = 23 - int_digits - 1;
                  if (decimals < 0) decimals = 0;
                  char fmt[16], tmp[64];
                  snprintf(fmt, sizeof(fmt), "%%.%df", decimals);
                  snprintf(tmp, sizeof(tmp), fmt, v);
                  std::string r(tmp);
                  if (decimals > 0) {
                      while (r.back() == '0') r.pop_back();
                      if (r.back() == '.') r.pop_back();
                  }
                  snprintf(buf, sizeof(buf), "%s", r.c_str());
              }
              return buf;
      - script.execute: refresh_display

