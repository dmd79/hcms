  - platform: template
    name: "backspace"
    id: btn_backspace
    on_press:
      - lambda: |-
          std::string& s = id(buffer);
          if(s.empty() || id(cursor_pos)==0) return;

          int pos = id(cursor_pos) - 1;

          // Lista delle funzioni da trattare come un unico "carattere"
          const std::vector<std::string> funcs = {
              "sin(", "cos(", "tan(", "asin(", "acos(", "atan(",
              "sinh(", "cosh(", "tanh(",
              "sqrt(", "cbrt(", "ln(", "log(", "log2(", "exp(",
              "abs(", "ceil(", "floor(", "round(",
              "factorial(", "deg(", "rad("
          };

          // Controlla se prima del cursore c'è una funzione
          for(auto &f : funcs) {
              int len = f.length();
              if(pos - len + 1 >= 0 && s.substr(pos - len + 1, len) == f) {
                  s.erase(pos - len + 1, len);
                  id(cursor_pos) -= len;
                  id(update_input_display)->execute();
                  return;
              }
          }

          // Controlla se siamo subito dopo una potenza ^(...)
          if(s[pos] == ')' && pos > 0) {
              int depth = 1;
              int i = pos - 1;
              while(i >= 0 && depth > 0) {
                  if(s[i] == ')') depth++;
                  else if(s[i] == '(') depth--;
                  i--;
              }
              // Controlla se prima della parentesi c'è ^
              if(i >= 0 && s[i] == '^') {
                  s.erase(i, pos - i + 1); // cancella ^(...) tutto insieme
                  id(cursor_pos) = i;
                  id(update_input_display)->execute();
                  return;
              }
          }

          // Altrimenti cancella un solo carattere
          s.erase(pos, 1);
          id(cursor_pos)--;
          id(update_input_display)->execute();

  - platform: template
    name: "cursor_left"
    id: btn_cursor_left
    on_press:
      - lambda: |-
          if(id(cursor_pos) == 0) return;

          std::string &s = id(buffer);
          int pos = id(cursor_pos) - 1;

          // 🔹 CASO 1: se siamo subito dopo ')'
          if(s[pos] == ')') {
              // entra DENTRO la parentesi
              id(cursor_pos) = pos;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 2: se siamo su '('
          if(s[pos] == '(') {
              pos--;

              // se c'è un '^' prima → salta
              if(pos >= 0 && s[pos] == '^') pos--;

              // se ci sono lettere → salta nome funzione
              while(pos >= 0 && isalpha(s[pos])) pos--;

              id(cursor_pos) = pos + 1;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 3: movimento normale
          id(cursor_pos)--;
          id(update_input_display)->execute();

  - platform: template
    name: "cursor_right"
    id: btn_cursor_right
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int len = s.length();
          int pos = id(cursor_pos);

          if(pos >= len) return;

          // 🔹 CASO 1: funzione (lettere seguite da '(')
          if(isalpha(s[pos])) {
              int i = pos;
              while(i < len && isalpha(s[i])) i++;

              if(i < len && s[i] == '(') {
                  // entra dentro la funzione
                  id(cursor_pos) = i + 1;
                  id(update_input_display)->execute();
                  return;
              }
          }

          // 🔹 CASO 2: '(' normale → entra
          if(s[pos] == '(') {
              id(cursor_pos) = pos + 1;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 3: ')'
          if(s[pos] == ')') {
              id(cursor_pos) = pos + 1;
              id(update_input_display)->execute();
              return;
          }

          // 🔹 CASO 4: default
          id(cursor_pos)++;
          id(update_input_display)->execute();

