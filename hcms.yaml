# =====================
# FUNZIONI SCIENTIFICHE
# =====================
  - platform: template
    name: "NEG"
    id: btn_neg_all
    on_press:
      - lambda: |-
          std::string& s = id(buffer);

          // CASO 0: risultato già calcolato
          if (id(last_was_result)) {
              id(result) = -id(result);
              char buf[32];
              snprintf(buf, sizeof(buf), "%.15g", id(result));
              s = buf;
              id(last_was_result) = true;
              id(cursor_pos) = s.length();
              id(update_result_display)->execute();
              return;
          }

          if(s.empty()) {
              s += "-";
              id(cursor_pos)++;
              id(update_input_display)->execute();
              return;
          }

          char last = s.back();

          // CASO 1: termina con ')'
          if(last == ')') {
              int depth = 0;
              int i = s.size() - 1;
              for(; i >= 0; i--) {
                  if(s[i] == ')') depth++;
                  else if(s[i] == '(') {
                      depth--;
                      if(depth == 0) break;
                  }
              }
              if(i < 0) return;

              // 🔹 NUOVO: verifica se è argomento di funzione
              int func_start = i - 1;
              while(func_start >= 0 && isalpha(s[func_start])) func_start--;

              bool is_function = (func_start < i - 1);

              if(is_function) {
                  // toggle su -sqrt(...)
                  if(func_start >= 0 && s[func_start] == '-' &&
                    (func_start == 0 || strchr("+-*/^(", s[func_start-1]))) {
                      s.erase(func_start, 1);
                  } else {
                      s.insert(func_start + 1, "-");
                  }
              } else {
                  // toggle normale su (...)
                  if(i > 0 && s[i-1] == '-' &&
                    (i-1 == 0 || strchr("+-*/^(", s[i-2]))) {
                      s.erase(i-1, 1);
                  } else {
                      s.insert(i, "-");
                  }
              }

              id(cursor_pos) = s.length();
              id(update_input_display)->execute();
              return;
          }

          // CASO 2: termina con numero
          if(isdigit(last) || last == '.') {
              int i = s.size() - 1;
              while(i >= 0 && (isdigit(s[i]) || s[i]=='.')) i--;

              // Controlla se c'è un ^ prima del numero finale
              if(i >= 0 && s[i] == '^') {
                  if(s.size() >= 3 && s[0] == '-' && s[1]=='(' && s.back()==')') {
                      s = s.substr(2, s.size()-3); // rimuove -(...)
                  } else {
                      s = "-(" + s + ")";
                  }
                  id(cursor_pos) = s.length();
                  id(update_input_display)->execute();
                  return;
              }

              // Toggle unario sul numero
              if(i>=0 && s[i]=='-' &&
                (i==0 || s[i-1]=='(' || s[i-1]=='+' || s[i-1]=='-' || s[i-1]=='*' || s[i-1]=='/' || s[i-1]=='^')) {
                  s.erase(i,1);
              } else {
                  s.insert(i+1, "-");
              }
              id(cursor_pos) = s.length();
              id(update_input_display)->execute();
              return;
          }

          // CASO 3: termina con operatore o '('
          if(last=='+' || last=='-' || last=='*' || last=='/' || last=='^') {
              // dopo un operatore NON fare nulla
              return;
          }

          // se termina con '(' → inserisci meno unario
          if(last=='(') {
              s += "-";
              id(cursor_pos)++;
              id(update_input_display)->execute();
              return;
          }

  - platform: template
    name: "+/- exp"
    id: btn_neg_exp
    on_press:
      - lambda: |-
          std::string& s = id(buffer);

          // CASO 0: risultato già calcolato
          if(id(last_was_result)) {
              id(result) = -id(result);
              char buf[32];
              snprintf(buf, sizeof(buf), "%.15g", id(result));
              s = buf;
              id(cursor_pos) = s.length();
              id(update_result_display)->execute();
              return;
          }

          // Trova l'ultimo ^
          int p = s.find_last_of('^');
          if(p == std::string::npos) return;

          // =========================
          // CASO ^(...)
          // =========================
          if(p + 1 < s.size() && s[p + 1] == '(') {

              // toggle del -
              if(p + 2 < s.size() && s[p + 2] == '-') {
                  s.erase(p + 2, 1);
              } else {
                  s.insert(p + 2, "-");
              }

              // trova fine parentesi
              int depth = 1;
              int i = p + 2;
              while(++i < s.size() && depth > 0) {
                  if(s[i] == '(') depth++;
                  else if(s[i] == ')') depth--;
              }

              id(cursor_pos) = i;   // ← DOPO l'esponente
              id(update_input_display)->execute();
              return;
          }

          // =========================
          // CASO ^numero
          // =========================
          int i = p + 1;

          // toggle -
          if(i < s.size() && s[i] == '-') {
              s.erase(i, 1);
          } else if(i < s.size() && (isdigit(s[i]) || s[i] == '.')) {
              s.insert(i, "-");
          } else {
              return;
          }

          // scorri fino a fine numero
          int end = p + 1;
          if(s[end] == '-') end++;
          while(end < s.size() && (isdigit(s[end]) || s[end] == '.')) end++;

          id(cursor_pos) = end;   // ← cursore DOPO l'esponente
          id(update_input_display)->execute();

