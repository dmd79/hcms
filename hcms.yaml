    id: btn_plus
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);

          // Se risultato precedente → continua la formula
          if (id(last_was_result)) {
              id(last_was_result) = false;
              pos = s.length();
              id(cursor_pos) = pos;
          }

          // NON inserire all'inizio
          if (pos == 0) return;

          char prev = s[pos - 1];

          // Inserisci solo se prima c'è numero o ')'
          if (isdigit(prev) || prev == ')') {
              s.insert(pos, "+");
              id(cursor_pos) = pos + 1;
              id(update_input_display)->execute();
          }

