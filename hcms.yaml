# DOT
  - platform: template
    name: "dot"
    id: btn_dot
    on_press:
      - lambda: |-
          if(id(last_was_result)) {
              if(id(buffer).empty() || id(buffer).back() != '(') {
                  id(buffer).clear();
                  id(cursor_pos)=0;
              }
              id(last_was_result)=false;
          }

          std::string &s = id(buffer);
          int pos = id(cursor_pos);

          // Se buffer vuoto o cursore all'inizio, aggiungi "0."
          if(s.empty() || pos == 0) {
              s.insert(pos, "0.");
              id(cursor_pos) += 2;
              id(update_input_display)->execute();
              return;
          }

          char prev = s[pos-1];

          // Se prima del cursore c'è ), aggiungi "*0."
          if(prev == ')') {
              s.insert(pos, "*0.");
              id(cursor_pos) += 3;
              id(update_input_display)->execute();
              return;
          }

          // Se prima del cursore c'è un operatore, aggiungi "0."
          if(prev == '+' || prev == '-' || prev == '*' || prev == '/' || prev == '^' || prev == '%' || prev == '(') {
              s.insert(pos, "0.");
              id(cursor_pos) += 2;
              id(update_input_display)->execute();
              return;
          }

          // Controlla se c'è già un punto nel numero corrente
          int start = pos - 1;
          while(start >= 0 && (isdigit(s[start]) || s[start]=='.')) start--;
          std::string current_number = s.substr(start+1, pos-start-1);
          if(current_number.find('.') != std::string::npos) return;

          s.insert(pos, ".");
          id(cursor_pos)++;
          id(update_input_display)->execute();

