esphome:
  name: hcms
  friendly_name: hcms
  platformio_options:
    board_build.flash_mode: dio
    build_unflags: -Werror=all
  includes:
    - LedDisplay/LedDisplay.cpp
    - LedDisplay/LedDisplay.h
    - LedDisplay/Font5x7.h
    - Calculator/Calculator.cpp
    - Calculator/Calculator.h
  on_boot:
    then:
      - lambda: |-
          static auto my_display_1 = new LedDisplay(13, 12, 9, 10, 14, 24);
          my_display_1->begin();
          my_display_1->clear();
          my_display_1->setBrightness((int)id(display_brightness).state);

          // Imposta cursore alla fine del buffer all'avvio
          id(cursor_pos) = id(buffer).length();
          id(last_key_time) = millis();
          return;

preferences:
  flash_write_interval: 0s

packages:
  keyboard: !include Calculator/keyboard.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

light:
  - platform: esp32_rmt_led_strip
    id: display_moodlight
    rgb_order: RGB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    use_psram: true
    name: "My Light"

logger:

api:
  encryption:
    key: !secret api_hcms

ota:
  platform: esphome
  password: !secret ota_hcms

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: !secret wifi_ssid_ha
    password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.188.83
    gateway: 192.168.188.1
    subnet: 255.255.255.0
  ap:
    ssid: "Hcms Fallback Hotspot"
    password: "k6O8BTRS0byE"

web_server:
  port: 80
  version: 2

external_components:
  - source:
      type: local
      path: LedDisplay

switch:
  - platform: gpio
    pin: 8
    id: power_enable
    restore_mode: ALWAYS_ON

# =====================
# VARIABILI GLOBALI
# =====================
globals:
  - id: a
    type: double
    initial_value: '0'
  - id: b
    type: double
    initial_value: '0'
  - id: result
    type: double
    initial_value: '0'
  - id: op
    type: char
    initial_value: "' '"
  - id: last_was_result
    type: bool
    initial_value: 'false'
  - id: pending_op
    type: char
    initial_value: ' '
  - id: calc_buffer
    type: std::string
    restore_value: false
    initial_value: ""
  - id: buffer
    type: std::string
    restore_value: false
    initial_value: ""
  - id: cursor_pos
    type: int
    initial_value: '0'
  - id: paren_alert
    type: bool
    initial_value: 'false'
  - id: paren_alert_count
    type: int
    initial_value: '0'
  - id: last_formula
