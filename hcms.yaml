  - platform: template
    name: "open"
    id: btn_par_open
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);

          // Carattere PRIMA del cursore
          char prev = (pos > 0) ? s[pos - 1] : '\0';

          // Moltiplicazione implicita SOLO se non siamo all'inizio
          if(pos > 0 && (isdigit(prev) || prev == ')')) {
              s.insert(pos, "*");
              pos++;
              id(cursor_pos) = pos;
          }

          // Inserisci parentesi aperta
          s.insert(pos, "(");
          id(cursor_pos) = pos + 1;

          id(update_input_display)->execute();

  - platform: template
    name: "close"
    id: btn_par_close
    on_press:
      - lambda: |-
          std::string &s = id(buffer);
          int pos = id(cursor_pos);

          // Non inserire se buffer vuoto
          if(s.empty()) return;

          // Controlla carattere precedente
          if(pos == 0) return; // niente prima del cursore
          char last = s[pos-1];
          if(last=='+' || last=='-' || last=='*' || last=='/' || last=='^' || last=='%' || last=='.' || last=='(') return;

          // Conta parentesi aperte fino al cursore
          int open_count = 0;
          for(int i=0; i<pos; i++) {
              if(s[i]=='(') open_count++;
              else if(s[i]==')') open_count--;
          }
          if(open_count <= 0) return;  // Nessuna parentesi aperta da chiudere

          // 🔹 Controlla se si è in mezzo a un numero → non inserire
          if(pos < s.size() && isdigit(s[pos])) return;

          // 🔹 Controlla se dentro la parentesi c'è qualcosa
          int last_open = -1;
          for(int i=pos-1; i>=0; i--) {
              if(s[i]=='(') { last_open = i; break; }
          }
          if(last_open >= 0) {
              bool has_content = false;
              for(int i=last_open+1; i<pos; i++) {
                  if(isdigit(s[i]) || isalpha(s[i]) || s[i]==')') {
                      has_content = true;
                      break;
                  }
              }
              if(!has_content) return; // niente dentro la parentesi → non inserire
          }

          // Inserisci parentesi chiusa
          s.insert(pos, ")");
          id(cursor_pos)++;
          id(update_input_display)->execute();

  - platform: template
    name: "equal"
    id: btn_equal
    on_press:
      - lambda: |-
          std::string expr = id(buffer);

          // Salva la formula prima di calcolare
          id(last_formula) = expr;

          // Controlla parentesi aperte/chiuse
          int open_par = 0, close_par = 0;
          for(char c : expr) {
              if(c=='(') open_par++;
              else if(c==')') close_par++;
          }

          if(open_par > close_par) {
              id(paren_alert) = true;
              id(paren_alert_count) = open_par - close_par;
              return;
          }

          // Calcola risultato
          double res = evalExpression(expr);
          id(result) = res;
          id(last_was_result) = true;

          char buf[32];
          if(std::isnan(res) || std::isinf(res)) {
              snprintf(buf, sizeof(buf), "ERROR");
          } else {
              double abs_res = std::fabs(res);

              // 🔹 Se troppo grande o troppo piccolo → scientifica
              if(abs_res >= 1e15 || (abs_res > 0 && abs_res < 1e-7)) {
                  snprintf(buf, sizeof(buf), "%.15e", res);
              } else {
                  double res_abs = std::fabs(res);
                  int int_digits = (res < 0) ? 1 : 0;
                  long long int_part = (long long)res_abs;
                  if (int_part == 0) int_digits += 1;
                  else { long long t = int_part; while (t > 0) { int_digits++; t /= 10; } }
                  int decimals = 23 - int_digits - 1;
                  if (decimals < 0) decimals = 0;
                  char fmt[16], temp[64];
                  snprintf(fmt, sizeof(fmt), "%%.%df", decimals);
                  snprintf(temp, sizeof(temp), fmt, res);
                  std::string s(temp);
                  if (decimals > 0) {
                      while(s.back()=='0') s.pop_back();
                      if(s.back()=='.') s.pop_back();
                  }
                  snprintf(buf, sizeof(buf), "%s", s.c_str());
              }
          }

          id(buffer) = std::string(buf);
          id(cursor_pos) = id(buffer).length();
          id(paren_alert) = false;
          id(update_input_display)->execute();

