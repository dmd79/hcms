matrix_keypad:
  id: calc_keypad
  rows:
    - pin: GPIO1   # Riga 1
    - pin: GPIO2   # Riga 2
    - pin: GPIO11  # Riga 3
    - pin: GPIO4   # Riga 4
    - pin: GPIO5   # Riga 5
    - pin: GPIO6   # Riga 6
  columns:
    - pin: GPIO7   # Colonna 1
    - pin: GPIO42  # Colonna 2
    - pin: GPIO15  # Colonna 3
    - pin: GPIO17  # Colonna 4
    - pin: GPIO18  # Colonna 5
    - pin: GPIO40  # Colonna 6
    - pin: GPIO41  # Colonna 7
    - pin: GPIO21  # Colonna 8
    - pin: GPIO39  # Colonna 9
    - pin: GPIO38  # Colonna 10
 
  keys: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz01234567"
  
  has_diodes: false

# =============================================
# Keyboard layout
# =============================================
# RIGA 1: HOME    <      >      END    C      DEL    M1     M2     M3     UNDO
# RIGA 2: sin     cos    tan    asin   acos   atan   (      )      %      +/-
# RIGA 3: sinh    cosh   tanh   ln     log    log2   7      8      9      /
# RIGA 4: x2      x3     xy     EXP    SQR    CUB    4      5      6      *
# RIGA 5: exp     abs    ceil   floor  PI     e      1      2      3      -
# RIGA 6: n!      DEG    RAD    round  spare  MCLR   0      .      =      +

binary_sensor:
  # ========================================
  # RIGA 1: Navigazione e Memoria
  # ========================================
  - platform: matrix_keypad
    keypad_id: calc_keypad
    id: key_home
    key: "A"
    on_press:
      then:
        - button.press: btn_cursor_home

  - platform: matrix_keypad
